<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Form</title>

  <!-- FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <form id="form">

      <h1>Contact Us</h1>

      <!-- ROW -->

      <div class="row">

        <!-- FIRST NAME -->

        <div class="form-group">

          <label for="firstName">
            First Name *
          </label>

          <input
            type="text"
            id="firstName"
          >

          <small class="error"></small>

        </div>

        <!-- LAST NAME -->

        <div class="form-group">

          <label for="lastName">
            Last Name *
          </label>

          <input
            type="text"
            id="lastName"
          >

          <small class="error"></small>

        </div>

      </div>

      <!-- EMAIL -->

      <div class="form-group">

        <label for="email">
          Email Address *
        </label>

        <input
          type="email"
          id="email"
        >

        <small class="error"></small>

      </div>

<div class="form-group">

  <label>
    Query Type *
  </label>

  <div class="radio-group">

    <label class="radio">
      <input type="radio" name="query" value="general">
      General Enquiry
    </label>

    <label class="radio">
      <input type="radio" name="query" value="support">
      Support Request
    </label>

  </div>

  <small id="query-error"></small>

</div>


      

      <!-- MESSAGE -->

      <div class="form-group">

        <label for="message">
          Message *
        </label>

        <textarea
          id="message"
        ></textarea>

        <small class="error"></small>

      </div>

      <!-- CHECKBOX -->

      <div class="checkbox-group">

        <input
          type="checkbox"
          id="checkbox"
        >

        <label for="checkbox">
          I consent to being contacted by the team *
        </label>

      </div>

      <small id="checkbox-error"></small>

      <!-- BUTTON -->

      <button type="submit">
        Submit
      </button>

      <!-- SUCCESS -->

      <div class="success" id="success">
        Message sent successfully!
      </div>

    </form>

  </div>

  <script src="script.js"></script>

</body>
</html>
